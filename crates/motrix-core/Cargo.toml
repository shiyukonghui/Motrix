[package]
name = "motrix-core"
version = "0.1.0"
edition = "2021"
description = "Motrix 核心库：配置读写、任务模型、下载引擎封装（GUI 与 CLI 共享）"
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
# 任务状态变化事件通道（Task 11）：TaskManager 用 tokio broadcast 发布 TaskEvent，
# 由 src-tauri 的 async 循环订阅并转发为 engine:task-event（send 不 await，可在同步上下文使用）
tokio = { workspace = true }
# KGet 下载引擎（crates.io 包名 "Kget"，v1.7 锁定，default-features 关闭：HTTP/FTP 等内置能力已足够，避免 gui/torrent 重依赖）
Kget = { workspace = true }
# 探总长（Task 2）：KGet 已传递引入 reqwest（Cargo.lock 已解析 v0.13.4，TLS 为 rustls
# 系：hyper-rustls / rustls-platform-verifier），此处直接声明以复用其 blocking 客户端
# 探测 http/https 的 Content-Length，不新增任何依赖。特性取 blocking + rustls（reqwest
# 0.13 实际特性名，default-tls 亦等价 rustls），与 KGet 启用的特性并集一致，不会引入
# 额外的 TLS 后端重复编译
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
# 并行 HTTP 下载引擎（用户选定方案，替换 KGet 的 AdvancedDownloader 并行路径）：
# fast-down 5.0.2（MIT，官方站点 fd.s121.top）= fast-pull（工作窃取并发核心）+
# reqwest 异步客户端 + HttpPuller/FastDownPuller + Prefetch（URL 探测）。
# 特性 fast-puller 同时启用 http + reqwest；不启用 reqwest-tls（TLS 复用上面
# reqwest 0.13 的 rustls 特性并集，避免引入 native-tls 重复编译）。
# 恢复语义：并行分块无"文件大小=已下载前缀"保证，由本 crate 的 fastdown.rs 通过
# 侧车状态文件（*.fd.json）记录已完成区间（Event::PushProgress + merge_progress），
# 恢复时 invert 求剩余区间，实现真正的字节级断点续传。
fast-down = { version = "5.0.2", default-features = false, features = ["fast-puller"] }
# fast-down 的 FastDownPullerOptions 需要 url::Url 构造；bytes 是 fast-pull Pusher
# trait（push(&ProgressEntry, bytes::Bytes)）的签名依赖；parking_lot 用于构造
# FastDownPullerOptions.resp（预取响应复用，类型为 Arc<parking_lot::Mutex<..>>）
url = "2"
bytes = "1"
parking_lot = "0.12"
# BitTorrent 引擎（Phase 3）：librqbit 是 rqbit 客户端的主库（Apache-2.0，纯 Rust），
# 提供 DHT / PEX / ut_metadata / uTP / Web Seeds / 文件选择等成熟能力，不自研 BT 协议。
# 版本精确锁定 =8.1.1（crates.io 当前最新稳定版；9.0.0-rc 为预发布不采用）。
# 特性选择：default-tls（HTTP 下载 .torrent / tracker 走 rustls 系）保留，
# 关闭默认的 http-api-client（我们直接用 Session/API 层，不启动 HTTP API 服务）。
# 调研参考：https://github.com/ikatson/rqbit 的 desktop/src-tauri/src/main.rs 桌面示例。
librqbit = { version = "=8.1.1", default-features = false, features = ["default-tls"] }
# base64 解码 .torrent 内容（aria2.addTorrent 的 params[0] 为 base64 编码的 torrent 文件）
base64 = "0.21"
# aria2 兼容 RPC 后端（Phase 5，Task 12）：CoreRpcBackend 从 src-tauri 迁入本 crate，
# GUI 与 motrix-cli daemon 共享同一份实现（见 MIGRATION-TAURI.md 4.1 crate 结构）。
# 仅依赖 motrix-rpc 的 RpcBackend trait 与 RpcError，无循环依赖（motrix-rpc 不依赖本 crate）。
motrix-rpc = { path = "../motrix-rpc" }

[dev-dependencies]
# 集成测试（tests/）使用：engine_integration.rs 的事件流测试轮询 broadcast 通道（TryRecvError）
tokio = { workspace = true }
# 集成测试构造任务 options JSON（json! 宏）
serde_json = { workspace = true }
# BT 回归测试（同 info_hash 重复添加共享 handle）：构造最小合法 .torrent 需计算
# pieces 的 SHA1（sha1）+ 临时目录（tempfile）；两者均已在 Cargo.lock 依赖树中
sha1 = "0.10"
tempfile = "3"
